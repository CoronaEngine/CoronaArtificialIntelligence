[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar"
version = "0.1.0"
description = "Quasar AI runtime for CoronaEngine editor integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.1",
    "langsmith>=0.2",
]
workflow = ["pandas>=2", "tomli>=2; python_version < '3.11'"]
media = ["httpx>=0.27", "Pillow>=10", "opencv-python>=4.10"]
providers = [
    "dashscope>=1.20",
    "google-genai>=1",
    "cryptography>=42",
    "alibabacloud-oss-v2>=1",
]
redis = ["redis>=5"]
mongo = ["pymongo>=4.6"]
sql = ["sqlalchemy>=2"]
plugins = ["PyYAML>=6"]
cabbage = []
web = ["fastapi>=0.115", "uvicorn>=0.30"]
object-recognition = [
    "numpy>=1.26",
    "sqlite-vec>=0.1",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.45",
    "bitsandbytes>=0.44; platform_system != 'Darwin'",
    "accelerate>=1",
    "qwen-vl-utils>=0.0.8",
]
all = [
    "langchain-core>=0.3",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.1",
    "langsmith>=0.2",
    "pandas>=2",
    "tomli>=2; python_version < '3.11'",
    "httpx>=0.27",
    "Pillow>=10",
    "opencv-python>=4.10",
    "dashscope>=1.20",
    "google-genai>=1",
    "cryptography>=42",
    "alibabacloud-oss-v2>=1",
    "redis>=5",
    "pymongo>=4.6",
    "sqlalchemy>=2",
    "PyYAML>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "sqlite-vec>=0.1",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.45",
    "bitsandbytes>=0.44; platform_system != 'Darwin'",
    "accelerate>=1",
    "qwen-vl-utils>=0.0.8",
]
dev = ["pytest>=8"]

[project.scripts]
quasar-chat = "Quasar.cai.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = ".."

[tool.setuptools.packages.find]
where = [".."]
include = ["Quasar*"]
